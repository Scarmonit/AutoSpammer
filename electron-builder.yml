appId: com.scarmonit.autospammer
productName: Auto Spammer
# Native modules ship prebuilt N-API binaries that load directly in Electron,
# so skip the from-source rebuild (which would require Visual Studio).
npmRebuild: false
# Harden the packaged binary with Electron Fuses (see build/afterPack.cjs).
afterPack: build/afterPack.cjs
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# Native N-API addons must stay unpacked so their .node binaries load at runtime.
asarUnpack:
  - "**/node_modules/uiohook-napi/**"
  - "**/node_modules/@nut-tree-fork/**"
win:
  icon: build/icon.ico
  target:
    # Installer (Start-menu + desktop shortcuts) ...
    - target: nsis
      arch:
        - x64
    # ... and a single portable .exe that just runs on double-click, no install.
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Auto Spammer
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: AutoSpammer-Setup-${version}.${ext}
portable:
  artifactName: AutoSpammer-Portable-${version}.${ext}
